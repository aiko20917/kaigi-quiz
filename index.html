<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海技QUIZ v0.2</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="eyebrow">THIRD CLASS DECK OFFICER</div><h1>海技<span>QUIZ</span></h1><p>記述式の海技士試験対策</p></header><section class="stats"><div><strong id="total">0</strong><small>登録問題</small></div><div><strong id="done">0</strong><small>採点済み</small></div><div><strong id="weak">0</strong><small>復習対象</small></div></section><section class="panel"><div class="controls"><label>科目<select id="subject"><option value="法規">法規</option><option value="運用">運用</option><option value="航海">航海</option></select></label><label>法律・分野<select id="topic"><option value="all">すべて</option></select></label><label>出題モード<select id="mode"><option value="normal">順番に</option><option value="random">ランダム</option><option value="weak">復習（△・×）</option></select></label></div><div class="toolbar"><button id="start">この条件で開始</button><button class="secondary" id="reset">学習履歴を削除</button></div></section><section class="panel question"><div class="meta" id="meta">問題を選んで開始</div><h2 id="question">「この条件で開始」を押してね。</h2><p class="hint" id="hint"></p><textarea id="response" placeholder="ここに自分の答えを書く（この版では自己採点）"></textarea><div class="toolbar"><button id="reveal">模範解答を見る</button><button class="secondary" id="next">次の問題 →</button></div><div class="ai-panel"><h3>AI採点（準備中）</h3><p>AI採点は公開用サーバーを接続した後に利用できます。APIキーはこの画面に入力しないでください。</p><button id="aiGrade" disabled>AIで100点満点採点（未接続）</button></div><div id="answerBox" class="answer hidden"><h3>模範解答</h3><p id="answer"></p><div class="toolbar"><button class="good" data-grade="○">○ 覚えた</button><button class="mid" data-grade="△">△ あやふや</button><button class="bad" data-grade="×">× できなかった</button></div></div></section><footer>v0.2 · スマホ対応 · 学習記録は端末ごとに保存 · AI採点はサーバー接続後</footer></main><script src="questions.js"></script><script src="app.js"></script></body></html>
